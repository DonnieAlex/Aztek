name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "app/icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # The announcements the welcome screen shows come from the Discussions with the site: refreshed every few hours.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # announcements.json: the latest posts of the Announcements discussion category, [{title, url, date}], for the
      # welcome screen. GitHub's discussions are only in its GraphQL API, which needs a token the program doesn't have.
      - name: Announcements
        env:
          GH_TOKEN: ${{ github.token }}
        # Never fails the deploy, but says why when the list comes out empty: a warning on the run's summary page.
        run: |
          echo '[]' > site/announcements.json
          if ! CAT=$(gh api graphql -f query='query { repository(owner: "srlegrand", name: "Aztek") { discussionCategory(slug: "announcements") { id } } }' --jq '.data.repository.discussionCategory.id' 2>err.txt); then
            echo "::warning title=Announcements::The category query failed: $(tr '\n' ' ' < err.txt)"
          elif [ -z "$CAT" ] || [ "$CAT" = "null" ]; then
            echo "::warning title=Announcements::No discussion category with the slug announcements"
          elif ! gh api graphql -f query='query($c: ID!) { repository(owner: "srlegrand", name: "Aztek") { discussions(first: 10, categoryId: $c, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { title url createdAt } } } }' -f c="$CAT" \
              --jq '[.data.repository.discussions.nodes[] | {title, url, date: .createdAt}]' > list.json 2>err.txt; then
            echo "::warning title=Announcements::The discussions query failed: $(tr '\n' ' ' < err.txt)"
          else
            cp list.json site/announcements.json
            [ "$(cat list.json)" = "[]" ] && echo "::warning title=Announcements::The category has no discussions"
          fi
          cat site/announcements.json
      - run: sh site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
