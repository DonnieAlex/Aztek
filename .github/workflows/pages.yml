name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "app/icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # The announcements the welcome screen shows come from the Discussions with the site: refreshed every few hours.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Built and deployed in two jobs, as GitHub lays it out: deploy-pages looking for the artifact in the job that has just
  # uploaded it found none, or two, and failed the deploys of 23/11/2026.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # announcements.json: the latest posts of the Announcements discussion category, [{title, url, date}], for the
      # welcome screen. GitHub's discussions are only in its GraphQL API, which needs a token the program doesn't have.
      - name: Announcements
        env:
          GH_TOKEN: ${{ github.token }}
        # Never fails the deploy, but says why when the list comes out empty: a warning on the run's summary page.
        # One query for the newest discussions with their category, kept to the Announcements category: no category
        # id or slug lookup to go wrong. The newest ten, however old.
        run: |
          echo '[]' > site/announcements.json
          if gh api graphql -f query='query { repository(owner: "srlegrand", name: "Aztek") { discussions(first: 50, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { title url createdAt category { name slug } } } } }' \
              --jq '[.data.repository.discussions.nodes[] | select(.category.slug == "announcements" or (.category.name | ascii_downcase) == "announcements") | {title, url, date: .createdAt}][:10]' > list.json 2>err.txt; then
            cp list.json site/announcements.json
            [ "$(tr -d ' \n' < list.json)" = "[]" ] && echo "::warning title=Announcements::No discussion in the Announcements category among the newest 50"
          else
            echo "::warning title=Announcements::The discussions query failed: $(tr '\n' ' ' < err.txt)"
            cat err.txt
          fi
          cat site/announcements.json
      - run: sh site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
